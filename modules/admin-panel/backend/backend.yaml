---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-backend
  namespace: admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adm-panel-backend
      version: v1
  template:
    metadata:
      labels:
        app: adm-panel-backend
        version: v1
    spec:
      #serviceAccountName: httpbin
      securityContext:
        fsGroup: 65532
      containers:
      - image: nikshav/rate-limiter-backend:1.2.0
        imagePullPolicy: IfNotPresent
        name: adm-panel
        env:
          - name: DEPLOY_REPO               
            valueFrom:
              configMapKeyRef:
                name: github-env
                key: DEPLOY_REPO
          - name: DEPLOY_BRANCH
            valueFrom:
              configMapKeyRef:
                name: github-env
                key: DEPLOY_BRANCH
          - name: GITHUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: github-auth
                key: GITHUB_TOKEN
        volumeMounts:  
        - mountPath: "/data"
          name: sqlite
        ports:
        - containerPort: 8080
      imagePullSecrets:
        - name: docker-auth
      volumes:  
        - name: sqlite
          persistentVolumeClaim:  
            claimName: sqlite-pvc